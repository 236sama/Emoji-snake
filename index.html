
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이모지 스네이크 게임 🐍</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #17251b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game {
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .score {
      font-size: 22px;
      margin: 15px;
    }

    canvas {
      display: block;
      width: min(90vw, 480px);
      height: auto;
      border: 5px solid #477a45;
      border-radius: 10px;
      background: #70bd62;
      image-rendering: pixelated;
    }

    .help {
      color: #c8dfc4;
      margin-top: 15px;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #e46b79;
      color: #251010;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #f28a9b;
    }

    /* 게임 오버 창 */
    .game-over {
      display: none;
      position: fixed;
      inset: 0;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      z-index: 10;
    }

    .game-over.show {
      display: flex;
    }

    .game-over-box {
      background: #e53935;
      color: white;
      padding: 35px 45px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      animation: pop 0.3s ease-out;
    }

    .game-over-box h2 {
      font-size: 30px;
      margin: 0 0 12px;
    }

    .game-over-box p {
      font-size: 21px;
    }

    @keyframes pop {
      from {
        transform: scale(0.6);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🐍 이모지 스네이크</h1>

    <div class="score">
      점수: <span id="score">0</span>
    </div>

    <canvas id="canvas" width="480" height="480"></canvas>

    <p class="help">
      WASD 키로 이동하기<br>
      과일 🍒을 먹으세요!
    </p>

    <button onclick="restartGame()">다시 시작</button>
  </div>

  <!-- 게임 오버 창 -->
  <div class="game-over" id="gameOver">
    <div class="game-over-box">
      <h2>게임 오버!</h2>
      <p>점수: <span id="finalScore">0</span></p>
      <button onclick="restartGame()">다시 하기</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const finalScoreText = document.getElementById("finalScore");
    const gameOverScreen = document.getElementById("gameOver");

    const tileSize = 30;
    const tileCount = 16;

    let snake;
    let direction;
    let nextDirection;
    let fruit;
    let score;
    let gameRunning;
    let gameEnded;
    let gameLoop;
    let gameOverTimer;

    function randomFruit() {
      let newFruit;

      do {
        newFruit = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (
        snake.some(segment =>
          segment.x === newFruit.x &&
          segment.y === newFruit.y
        )
      );

      return newFruit;
    }

    function startGame() {
      snake = [
        { x: 8, y: 8 },
        { x: 7, y: 8 },
        { x: 6, y: 8 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };

      score = 0;
      scoreText.textContent = score;

      gameRunning = true;
      gameEnded = false;

      fruit = randomFruit();

      gameOverScreen.classList.remove("show");

      clearInterval(gameLoop);
      clearTimeout(gameOverTimer);

      drawGame();

      gameLoop = setInterval(updateGame, 140);
    }

    function drawGame() {
      // 빈칸 그리기
      ctx.fillStyle = "#70bd62";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "25px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // 격자 배경 🟩
      for (let y = 0; y < tileCount; y++) {
        for (let x = 0; x < tileCount; x++) {
          ctx.fillText(
            "🟩",
            x * tileSize + tileSize / 2,
            y * tileSize + tileSize / 2
          );
        }
      }

      // 과일 🍒
      ctx.fillText(
        "🍒",
        fruit.x * tileSize + tileSize / 2,
        fruit.y * tileSize + tileSize / 2
      );

      // 뱀 몸통 🟡
      snake.forEach((segment, index) => {
        const emoji = index === 0
          ? (gameEnded ? "😵" : "😀")
          : "🟡";

        ctx.fillText(
          emoji,
          segment.x * tileSize + tileSize / 2,
          segment.y * tileSize + tileSize / 2
        );
      });
    }

    function updateGame() {
      if (!gameRunning) return;

      direction = { ...nextDirection };

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // 벽 충돌 검사
      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      // 과일을 먹지 않는 경우 꼬리가 이동하므로
      // 마지막 칸은 자기 몸 충돌 검사에서 제외
      const eatingFruit =
        head.x === fruit.x && head.y === fruit.y;

      const bodyToCheck = eatingFruit
        ? snake
        : snake.slice(0, -1);

      // 자기 몸 충돌 검사
      if (
        bodyToCheck.some(segment =>
          segment.x === head.x && segment.y === head.y
        )
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eatingFruit) {
        score++;
        scoreText.textContent = score;
        fruit = randomFruit();
      } else {
        snake.pop();
      }

      drawGame();
    }

    function endGame() {
      gameRunning = false;
      gameEnded = true;

      clearInterval(gameLoop);

      // 머리 표정을 😵로 변경
      drawGame();

      // 1초 후 화면 중앙에 게임 오버 창 표시
      finalScoreText.textContent = score;

      gameOverTimer = setTimeout(() => {
        gameOverScreen.classList.add("show");
      }, 1000);
    }

    function restartGame() {
      startGame();
    }

    // WASD 키보드 조작
    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      const controls = {
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 }
      };

      if (!controls[key]) return;

      event.preventDefault();

      const newDirection = controls[key];

      // 반대 방향으로 즉시 회전하는 것 방지
      if (
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
      ) {
        return;
      }

      nextDirection = newDirection;
    });

    // 게임 시작
    startGame();
  </script>

</body>
</html>
